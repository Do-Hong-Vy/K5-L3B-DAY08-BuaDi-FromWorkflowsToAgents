<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LogiX-VN Lab 8 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky checkpoint rail on top, one view per checkpoint, presented like a claims desk ledger */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --line:#d3dae1;
  --fg:#16212c; --muted:#5b6874; --accent:#0f6e74; --accent-soft:#d7eced;
  --ok:#1f7a45; --ok-soft:#dcf0e3; --bad:#b4322a; --bad-soft:#f7dedb; --warn:#9a6a06; --warn-soft:#f6ecd2;
  --f-display:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16212a; --sunk:#1d2a35; --line:#2b3a47;
  --fg:#e3eaf0; --muted:#93a2af; --accent:#4fc2c8; --accent-soft:#143a3d;
  --ok:#5cc98a; --ok-soft:#173726; --bad:#f08178; --bad-soft:#3d1c1a; --warn:#e2b450; --warn-soft:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16212a; --sunk:#1d2a35; --line:#2b3a47;
  --fg:#e3eaf0; --muted:#93a2af; --accent:#4fc2c8; --accent-soft:#143a3d;
  --ok:#5cc98a; --ok-soft:#173726; --bad:#f08178; --bad-soft:#3d1c1a; --warn:#e2b450; --warn-soft:#3a2e12; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start;padding-block:24px 56px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr);gap:20px}nav.rail{position:static}}
nav.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-size:14px;font-weight:600;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
nav.rail a span{flex:none;width:38px;text-align:center;font-family:var(--f-mono);font-size:11px;padding:3px 0;border-radius:5px;background:var(--sunk);color:var(--muted)}
nav.rail a:hover{border-color:var(--accent);color:var(--accent)}
nav.rail a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
nav.rail a[aria-current="page"] span{background:var(--surface);color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0}
section.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px);line-height:1.15;font-weight:800}
h2{font-size:clamp(21px,2.8vw,27px);font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0;max-width:68ch}
.lead{font-size:17px;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.92em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.kpi .v{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);font-weight:600}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pick td{background:var(--accent-soft)}
.shape{display:flex;flex-direction:column;gap:8px}
.shape .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:6px;border-radius:2px;background:var(--sunk)}
.meter i.on{background:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{opacity:.9;color:var(--surface)}
/* claim explorer */
.explorer{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:14px}
@media (max-width:760px){.explorer{grid-template-columns:minmax(0,1fr)}}
.claims{display:flex;flex-direction:column;gap:4px;max-height:640px;overflow:auto}
@media (max-width:760px){.claims{flex-direction:row;overflow-x:auto;max-height:none}}
.claims button{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer;flex:none}
.claims button b{font-family:var(--f-mono);font-size:13px}
.claims button span{font-size:12px;color:var(--muted)}
.claims button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ticket{background:var(--warn-soft);border:1px dashed var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ticket .lbl{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.ticket q{font-size:16px;quotes:"“" "”"}
.pipe{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;position:relative}
.step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);border:2px solid var(--line);z-index:1}
.step:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;bottom:-8px;width:2px;background:var(--line)}
.step.done .dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.step.stop .dot{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.step.skip{opacity:.42}
.step .t{font-weight:600;font-size:14px}
.step .d{font-size:13px;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.5;margin:0;max-height:360px}
.cmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cmp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmp div{background:var(--sunk);border-radius:8px;padding:10px}
.cmp .k{font-size:12px;color:var(--muted)}
.cmp .v{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
/* durability */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tx{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;overflow-x:auto}
.tx .box{flex:1 1 120px;min-width:120px;border:1px solid var(--line);background:var(--surface);padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.tx .box:first-child{border-radius:8px 0 0 8px}.tx .box:last-child{border-radius:0 8px 8px 0}
.tx .box b{font-size:13px}
.tx .crash{flex:0 0 auto;display:grid;place-items:center;padding:0 6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);border-block:1px solid var(--line);background:var(--sunk)}
.tx .crash.on{background:var(--bad);color:var(--surface);font-weight:600}
.tx .box.txn{background:var(--accent-soft)}
.timeline{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:14px}
.timeline li b{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
/* crash grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.cell.fail{border-left-color:var(--bad)}
.cell b{font-family:var(--f-mono);font-size:12px}
.cell span{font-size:12px;color:var(--muted);word-break:break-word}
/* heatmap */
.heat{overflow-x:auto}
.heat table{font-size:12px;min-width:640px}
.heat td,.heat th{padding:6px 6px;text-align:center}
.heat th:first-child,.heat td:first-child{text-align:left;font-family:var(--f-mono)}
.dots{display:inline-flex;gap:2px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--ok)}
.dots i.f{background:var(--bad)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:100px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{background:var(--sunk);border-radius:4px;height:18px;overflow:hidden}
.bar .fill{height:100%;background:var(--muted);border-radius:4px}
.bar.win .fill{background:var(--accent)}
.bar .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.cmd{display:flex;gap:8px;align-items:stretch}
.cmd pre{flex:1;min-width:0;margin:0}
.copy{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:0 10px;cursor:pointer}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){section.view{animation:fade .25s ease-out}}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>

document.addEventListener("click", e=>{
  const cb = e.target.closest("#claims button");
  if(cb){ selClaim = cb.dataset.id;
    document.querySelectorAll("#claims button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.id===selClaim));
    document.getElementById("detail").innerHTML = claimDetail(); return; }
  const sb = e.target.closest("#crashSeg button");
  if(sb){ selCrash = sb.dataset.k;
    document.querySelectorAll("#crashSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===selCrash));
    document.getElementById("crashView").innerHTML = crashView(); return; }
  const cp = e.target.closest(".copy");
  if(cp){ const pre = document.getElementById("cmd"+cp.dataset.i);
    const done = ()=>{cp.textContent="Đã chép"; setTimeout(()=>cp.textContent="Sao chép",1500);};
    try{ navigator.clipboard.writeText(pre.textContent).then(done,()=>{selectText(pre);}); }catch(_){ selectText(pre); } }
});
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
addEventListener("hashchange", ()=>{render(); if(matchMedia("(max-width:760px)").matches){document.getElementById("app").scrollIntoView();}else{scrollTo({top:0});}});
